[project]
name = "kete"
version = "0.1.0"
description = "Local-first personal finance CLI/TUI for Westpac NZ export files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "ofxparse>=0.21",
]

[project.scripts]
kete = "kete.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kete"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ofxparse"]
